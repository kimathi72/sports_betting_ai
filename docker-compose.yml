name: sports-betting-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sports_betting_ai_development}
      POSTGRES_USER: ${POSTGRES_USER:-sports_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ml:
    build:
      context: ./ml
    environment:
      # Model artifacts live outside the image so they survive a rebuild and can
      # be produced by the training entry point. Paths match ml/app/model_store.py
      # exactly: one file per market plus the metrics report.
      ML_MODEL_PATH: /app/artifacts/model_1x2.joblib
      ML_METRICS_PATH: /app/artifacts/metrics.json
    volumes:
      # Read-only for the API process: the service loads artifacts, it must not
      # rewrite them mid-request. Training runs as a one-off container that
      # writes to the same host directory.
      - ./ml/artifacts:/app/artifacts
    ports:
      - "127.0.0.1:${ML_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Rails API container. Builds from backend/Dockerfile; runs puma.
  # The entrypoint waits for postgres and runs `db:prepare` before booting.
  web:
    build:
      context: ./backend
    profiles: ["application"]
    # Provider credentials live in backend/.env (git-ignored) and are read by
    # Rails at runtime. `env_file` rather than `environment:` because the values
    # must never be written into this tracked file. `required: false` keeps the
    # stack startable for anyone without credentials; the API-Football client
    # then reports a configuration error instead of the app failing to boot.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      RAILS_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sports_betting_ai_development}
      POSTGRES_USER: ${POSTGRES_USER:-sports_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      REDIS_URL: redis://redis:6379/0
      # Rails calls the ML service by its Compose service name, never
      # localhost: inside a container localhost is the container itself.
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:8000}
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      # Import fixtures live at the repository root so they are shared between
      # the backend and the future data pipeline. Mounted read-only: the app
      # reads fixtures but must never write back into the source tree.
      - ./data:/data:ro
      # Only the raw-download directory is writable. It is a separate mount
      # nested inside the read-only parent, so downloads persist to the host's
      # data/raw while data/fixtures stays read-only. Raw data is git-ignored
      # (data/raw/* with .gitkeep preserved), so this cannot leak into history.
      - ./data/raw:/data/raw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:3000/up || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Sidekiq worker. Shares the web image; must not run migrations so web and
  # sidekiq never race each other against the schema.
  sidekiq:
    build:
      context: ./backend
    profiles: ["application"]
    # Provider credentials live in backend/.env (git-ignored) and are read by
    # Rails at runtime. `env_file` rather than `environment:` because the values
    # must never be written into this tracked file. `required: false` keeps the
    # stack startable for anyone without credentials; the API-Football client
    # then reports a configuration error instead of the app failing to boot.
    env_file:
      - path: ./backend/.env
        required: false
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      RAILS_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sports_betting_ai_development}
      POSTGRES_USER: ${POSTGRES_USER:-sports_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      REDIS_URL: redis://redis:6379/0
      # Rails calls the ML service by its Compose service name, never
      # localhost: inside a container localhost is the container itself.
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:8000}
      RUN_MIGRATIONS: "false"
      # Which recurring jobs this worker registers at boot (handout §25.4).
      #
      # WITHOUT THIS LINE the variable is silently dropped: Compose passes only
      # the keys listed here, so `SIDEKIQ_CRON_MODE=... docker compose up -d
      # sidekiq` would start a worker with the variable ABSENT, which resolves to
      # `disabled` — registering nothing at all. The default below is `disabled`
      # for the same reason: an unset variable must never activate every job.
      SIDEKIQ_CRON_MODE: ${SIDEKIQ_CRON_MODE:-disabled}
    volumes:
      - ./backend:/app
      # The worker resolves the same import paths the `web` service accepts, so
      # the data directory must be visible to it too. Read-only for the same
      # reason: imports read fixtures and never write back into the source tree.
      - ./data:/data:ro
      # The worker reads downloaded raw files, so the same narrowly-writable
      # raw mount as `web` is required; fixtures stay read-only.
      - ./data/raw:/data/raw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  mobile:
    image: node:22-alpine
    profiles: ["application"]
    command: ["node", "-e", "setInterval(() => {}, 1000)"]
    working_dir: /app

volumes:
  postgres_data:
  redis_data:
