# Multi-competition historical manifest — 2016/17 through 2023/24.
#
# (Paths deliberately carry a '# ' prefix in this comment so a plain grep for
# the download URL pattern in data/manifests never mistakes documentation for an
# entry. Real entries start with '- path:'.)
#
# This is the deep-history companion to multi_league_history.yml (2024/25 and
# 2025/26). All eight seasons are complete football-data.co.uk archives, so every
# row is a final result.
#
# TWO SOURCE ERAS, HANDLED BY THE EXISTING IMPORTER (verified, not assumed):
#   * 2016/17 – 2018/19 files have NO TIME COLUMN. Kickoff is stored at 00:00 for
#     that date and docs/dataset-quality.md lists those rows per season.
#   * 2019/20 – 2023/24 files carry Time.
# The adapter already treats Time as optional; the downloader records
# `missing_time_column?` in the file metadata.
#
# Import:
#   docker compose exec -T web \
#     bundle exec rake "import:historical[/data/manifests/multi_league_deep_history.yml,2016/17]"
