name: sports-betting-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sports_betting_ai_development}
      POSTGRES_USER: ${POSTGRES_USER:-sports_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ml:
    build:
      context: ./ml
    ports:
      - "127.0.0.1:${ML_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Rails API container. Builds from backend/Dockerfile; runs puma.
  # The entrypoint waits for postgres and runs `db:prepare` before booting.
  web:
    build:
      context: ./backend
    profiles: ["application"]
    environment:
      RAILS_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sports_betting_ai_development}
      POSTGRES_USER: ${POSTGRES_USER:-sports_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      # Import fixtures live at the repository root so they are shared between
      # the backend and the future data pipeline. Mounted read-only: the app
      # reads fixtures but must never write back into the source tree.
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:3000/up || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Sidekiq worker. Shares the web image; must not run migrations so web and
  # sidekiq never race each other against the schema.
  sidekiq:
    build:
      context: ./backend
    profiles: ["application"]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      RAILS_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sports_betting_ai_development}
      POSTGRES_USER: ${POSTGRES_USER:-sports_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
      # The worker resolves the same import paths the `web` service accepts, so
      # the data directory must be visible to it too. Read-only for the same
      # reason: imports read fixtures and never write back into the source tree.
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  mobile:
    image: node:22-alpine
    profiles: ["application"]
    command: ["node", "-e", "setInterval(() => {}, 1000)"]
    working_dir: /app

volumes:
  postgres_data:
  redis_data:
